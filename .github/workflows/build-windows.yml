name: Build Windows

on:
  workflow_dispatch:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout qui
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Download Go dependencies
        run: go mod download

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Copy frontend
        shell: pwsh
        run: |
          if (Test-Path "internal/web/dist") {
            Remove-Item -Recurse -Force "internal/web/dist"
          }
          Copy-Item -Recurse "web/dist" "internal/web/dist"

      - name: Build Windows executable
        run: go build -o qui.exe ./cmd/qui

      - name: Upload qui.exe
        uses: actions/upload-artifact@v4
        with:
          name: qui-windows
          path: qui.exe
