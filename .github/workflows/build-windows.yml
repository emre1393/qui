name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout qui
        uses: actions/checkout@v4
        with:
          path: qui

      - name: Checkout modified rls
        uses: actions/checkout@v4
        with:
          repository: emre1393/rls
          ref: master
          path: rls

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          cache: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Adapt rls imports
        working-directory: rls
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter *.go | ForEach-Object {
            $content = Get-Content $_.FullName -Raw
            $content = $content -replace 'github\.com/autobrr/rls', 'github.com/moistari/rls'
            Set-Content -Path $_.FullName -Value $content -NoNewline
          }

      - name: Configure local rls
        working-directory: qui
        run: go mod edit -replace github.com/moistari/rls=../rls

      - name: Download Go dependencies
        working-directory: qui
        run: go mod download

      - name: Build frontend
        working-directory: qui/web
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Copy frontend
        working-directory: qui
        shell: pwsh
        run: |
          if (Test-Path "internal/web/dist") {
            Remove-Item -Recurse -Force "internal/web/dist"
          }
          Copy-Item -Recurse "web/dist" "internal/web/dist"

      - name: Build Windows executable
        working-directory: qui
        run: go build -o qui.exe ./cmd/qui

      - name: Upload qui.exe
        uses: actions/upload-artifact@v4
        with:
          name: qui-windows
          path: qui/qui.exe