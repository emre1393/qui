name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout qui
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  windows:
    name: Build Windows
    runs-on: ubuntu-latest
    needs: web

    steps:
      - name: Checkout qui
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download rls dependency
        run: go mod download

      - name: Prepare modified rls
        shell: bash
        run: |
          go mod download github.com/autobrr/rls@v0.8.1

          RLS_CACHE="$(go env GOMODCACHE)/github.com/autobrr/rls@v0.8.1"

          echo "Copying rls from:"
          echo "$RLS_CACHE"

          cp -a "$RLS_CACHE" ./rls-build
          chmod -R u+w ./rls-build

          curl -fsSL \
            https://raw.githubusercontent.com/emre1393/rls/master/taginfo/taginfo.csv \
            -o ./rls-build/taginfo/taginfo.csv

          curl -fsSL \
            https://raw.githubusercontent.com/emre1393/rls/master/lex.go \
            -o ./rls-build/lex.go

          # The local rls module declares itself as github.com/moistari/rls.
          # Make the copied source use that module path too.
          grep -RIl 'github.com/autobrr/rls' ./rls-build \
            --include='*.go' \
            --include='go.mod' \
            | xargs -r sed -i 's#github\.com/autobrr/rls#github.com/moistari/rls#g'

          echo "Modified rls files:"
          sha256sum ./rls-build/lex.go
          wc -l ./rls-build/taginfo/taginfo.csv

          echo "Checking rls imports:"
          grep -R 'github.com/autobrr/rls' ./rls-build --include='*.go' || true

      - name: Configure local rls
        run: |
          go mod edit -replace github.com/moistari/rls=./rls-build

      - name: Build Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o qui.exe \
            ./cmd/qui

      - name: Package Windows
        shell: bash
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")

          mkdir qui-windows
          cp qui.exe qui-windows/

          cd qui-windows
          zip "../qui-windows-${TIMESTAMP}.zip" qui.exe

          echo "ZIP_NAME=qui-windows-${TIMESTAMP}.zip" >> "$GITHUB_ENV"

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}