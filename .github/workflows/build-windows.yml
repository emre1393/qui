  windows:
    name: Build Windows
    runs-on: ubuntu-latest
    needs: web

    steps:
      - name: Checkout qui
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download upstream rls
        run: go mod download github.com/moistari/rls@v0.8.1

      - name: Replace rls CSV
        run: |
          curl -L \
            https://raw.githubusercontent.com/emre1393/rls/master/taginfo/taginfo.csv \
            -o modified-taginfo.csv

          RLS_DIR=$(go env GOPATH)/pkg/mod/github.com/moistari/rls@v0.8.1

          echo "Replacing:"
          echo "$RLS_DIR/taginfo/taginfo.csv"

          cp modified-taginfo.csv "$RLS_DIR/taginfo/taginfo.csv"

      - name: Build Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o qui.exe \
            ./cmd/qui

      - name: Package Windows
        run: |
          mkdir qui-windows
          cp qui.exe qui-windows/
          cd qui-windows
          zip ../qui-windows-x86_64.zip qui.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: qui-windows
          path: qui-windows-x86_64.zip