name: Build Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    name: Build web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout qui
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
          run_install: false

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: web
        run: pnpm build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  windows:
    name: Build Windows
    runs-on: ubuntu-latest
    needs: web

    steps:
      - name: Checkout qui
        uses: actions/checkout@v4

      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download rls dependency
        run: go mod download

      - name: Replace rls CSV
        shell: bash
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/emre1393/rls/master/taginfo/taginfo.csv \
            -o modified-taginfo.csv

          RLS_DIR="$(go env GOMODCACHE)/github.com/autobrr/rls@v0.8.1"

          echo "Using rls from:"
          echo "$RLS_DIR"

          test -f "$RLS_DIR/taginfo/taginfo.csv"

          cp modified-taginfo.csv "$RLS_DIR/taginfo/taginfo.csv"

          echo "CSV replaced successfully."

      - name: Build Windows
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 \
            go build \
            -trimpath \
            -ldflags="-s -w" \
            -o qui.exe \
            ./cmd/qui

      - name: Package Windows
        run: |
          mkdir qui-windows
          cp qui.exe qui-windows/
          cd qui-windows
          zip ../qui-windows-x86_64.zip qui.exe

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: qui-windows-x86_64
          path: qui-windows-x86_64.zip